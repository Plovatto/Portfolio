name: Lighthouse

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /

      # The site sends visitors to their system language, so each page is
      # audited with a browser in that page's language.
      - name: Audit the Portuguese page
        run: npm run lighthouse -- --collect.url=http://localhost/
        env:
          LANG: pt_BR.UTF-8
          LANGUAGE: pt_BR

      - name: Audit the English page
        run: npm run lighthouse -- --collect.url=http://localhost/en/
        env:
          LANG: en_US.UTF-8
          LANGUAGE: en_US
