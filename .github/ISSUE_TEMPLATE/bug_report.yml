name: Bug report
description: Something on the site is broken or looks wrong.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Security issues must be reported through the [security policy](https://github.com/Plovatto/Portfolio/security/policy) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://plovatto.dev/en/
        2. Scroll to the projects section
        3. Open the x-ray lens on SparkChat
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Site language
      options:
        - Português (/)
        - English (/en/)
        - Both
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Dark
        - Light
        - Both
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 131 on Android 15
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Optional. Drag files here to attach them.
